- title: "General Relativity: An Introduction to Black Holes, Gravitational Waves, and Cosmology"
  isbn: "978-1-68174-885-6"
  category: "physics"
  author: "Michael J W Hall"
  cover: "/img/books_cover/gr.webp"
  reading_progress: 100%
  review: "虽然后面零零散散看过别的广义相对论的教材，但是我第一遍学广义相对论实际上看的是这本一看就装不了太多东西的小册子。这本书的定位感觉有点像俞允强老师的广义相对论的小书（或者赵峥老师那本），不过该讲的基本知识还是到位了，而且不是几何的讲法，就是物理的分量语言那套张量分析硬算就完事了，对于想要迅速了解一下GR的同学我觉得还是比较有帮助的。对于做场论的来说或许广相没什么特别的，而黎曼几何这种东西在hep-th里面又是司空见惯，所以自然即便你没有好好看过一本所谓很有名的经典名著学一遍广义相对论也不大要紧。\n\n 另外说一句IOP Science出版的这一套丛书都很不错，都是很短的篇幅介绍某个领域，有点对标springer brief系列，不过感觉topic要初级一些。不妨上官方网站上看看有没有自己感兴趣但是又不想花过多时间，单纯想了解一下的领域，找来书读一下。"

- title: "Introduction to Conformal Field Theory: With Applications to String Theory"
  isbn: "978-3-642-00450-6"
  category: "physics"
  author: "Ralph Blumenhagen , Erik Plauschinn"
  cover: "/img/books_cover/blumenhagen.webp"
  reading_progress: 80%
  review: "CFT是一个非常庞杂的学科，就算是弦理论，CFT的方法也是后面才兴起的，而且只应用了CFT的一小部分。即便是2d的CFT也有很多东西可以讲，从大黄书的厚度可见一斑，不过对于大多数不主要做CFT，或者对于弦论学家而言，啃一遍大黄书意义或许不大，而这个时候一本比较薄但是又不失深度的CFT书就很有必要，但是目前市面上的CFT书籍还是很少，但是Blumenhagen的这本书极其适合弦论学家读。但是不要以为这本书很薄所以不深入，由于Blumenhagen是弦论学家，经常应用CFT，所以对CFT各方面的技术都比较熟，虽然这本书受篇幅限制没办法展开讲每一个技术，但是都有简明的介绍，而且也有详尽的参考文献。而且这本书与弦论非常接轨，虽然这本书并不假设你学过弦论，但是我觉得如果你完全不懂弦论（就跟我第一次看一样），看起来有些地方还是很费劲难以理解的，不过不妨先放着，后面学弦论之后再回过头看重新理解。不过相比于Blumenhagen的另一本书，也就是弦论简介那本，这本书的typo很多，而且写的很随意，很多前后notation不一致的情况。我推荐这本书夹带一个私货正是因为我曾指出过书里面的一个typo在他的个人主页上留名了，哈哈。"

- title: "共形場理論 : 現代数理物理の基礎として"
  isbn: "978-4-7819-9923-4"
  category: "physics"
  author: "伊藤克司"
  cover: "/img/books_cover/ito.webp"
  reading_progress: 80%
  review: "这本书也是我之前本科学CFT时候看的，非常非常好，非常基础，讲解的很细致，计算也比较详尽，也是这本书让我知道了SGC系列，这个系列的书都是很短的简要介绍之类的。这本书是相当readable的，只要学过QFT就能完全理解里面的内容我觉得，所以这本书也主要聚焦于CFT本身的基础原理，不去讲具体的应用。但是考虑到CFT抛开作为弦论的基础工具这一属性，本身就是一门非常有意思的学科，所以系统的看一遍对于学习现代理论物理还是有必要的。初学CFT我觉得完全可以先读一遍这本小书找找感觉，知道大致在做什么，研究方法和一般的场论有何不同。另外我的Github主页存有这本书的中文翻译版，毕竟日文并非科研通用语言。"

- title: "Photonic crystals: molding the flow of light"
  isbn: "978-0-691-12456-8"
  category: "physics"
  author: "John D. Joannopoulos, Steven G. Johnson, Joshua N. Winn, Robert D. Meade"
  cover: "/img/books_cover/crystal.webp"
  reading_progress: 50%
  review: "我曾和很多人提起过我最一开始并不想做高能，虽然似乎不少进入物理系的同学都怀揣着理论物理梦。但我在当时大一的时候就觉得自己没啥天赋（当然现在也没有展现出多少天赋），不应该去搞理论物理这个方向，所以我当时更热衷于计算物理一些实际的东西。实际上这也和我的高中竞赛经历有关，那些难题我根本没能力做出来，所以也觉得自己比较笨。后来刚上大学肖孟老师就找到我问我想不想看一些科研相关的，然后就给我推荐了这本书，尝试复现一下里面的东西。首先虽然看起来这本书里面有很多能带图，但是实际上和量子力学没多大关系，都是用的maxwell方程组这种东西，你可以把量子力学的能带论看作是在讨论固体中的电子，而这里则是在讨论光子。而Maxwell方程其实也可以写成定态薛定谔方程那种本征方程形式，然后加上合适的边界条件就会发现也会得到离散的本征值分布，也可以类似建立能带论。老实说我当时并没有太看懂，是后面没做这个了，才恍然大悟知道他到底在说什么。学习这本书最好的方式或许是用COMSOL或者别的软件实现一下这个书里面的图，不过后来发现我完全搞不来，书也其实看不太懂。后面杜老师推荐我看一些高能相关的书籍之后我也就彻底放弃这方面毅然决然选择高能物理了。。。（这么说来我选择高能物理可以归结为是因为这本书的作者写书没让我看懂，哈哈）。\n\n不管怎么说，这本书还是业内非常有名的书，而且我现在回头想想确实很推荐初学者看看，而且这还算是一个比较新的领域，拿来练练数值模拟也不错。就很凝聚态的，书里面很多精美的数值插图，不过可能会让想做纯粹理论凝聚态的同学失望。另外这本书不要买中文译本，翻译的太垃圾了，不能看的那种，这本书我记得英文版在作者主页上是可以免费下载的，还是直接看英文版吧。不过是先说明我不是这一理论的专家而且只看过这本书的前面一半，况且还是尝试看这本书没能看下去的失败者，所以本书评看个乐呵就好。"

- title: "Linear Algebra Done Right"
  isbn: "978-3-031-41025-3"
  category: "math"
  author: "Sheldon Axler"
  cover: "/img/books_cover/linear.webp"
  reading_progress: 100%
  review: "伟大无需多言，我觉得每一个物理系的学生都应该看一遍这本书。本科学的那些只能称之为矩阵算法，完全称不上线性代数，在大一看一下这本书会让你有抽象的思维能力，更为你以后学习量子力学打下坚实的基础，国内的物理系本科生不少人学完量子力学后虽然能拿到高分，但是其实连Dirac notation都无法真正理解，也就是无法理解Hilbert space这套语言，终究就是线性代数没学好，如果你以后做的是偏量子化学那种计算的，或许学个薛定谔方程，解解波函数没问题，但是我觉得如果你励志于做理论物理，学好线性代数便是第一关。而没有比这本书更好的答案。我当时看这本书非常认真，书后的几乎每一个习题都自己认真做过，当然现在来看不必如此浪费时间，如果觉得书里面的内容自己没有理解，或者没多大把握，那就做个两三题测试一下自己的理解就好，没必要陷入题海里面，都大学了，走出高中的做题思维框架是第一步。在本科学完线性代数，也就是大一上学期的寒假，完全可以开始看这本书，告诉你矩阵到底是什么，后面做理论物理你会碰到更多更抽象的数学概念，而所有这些数学概念最基础的东西全部都在这本书里面了，所以我认为这本书非常非常重要。"

- title: "Discrete Mathematics and Its Applications"
  isbn: "978-1266191541"
  category: "math, computer"
  author: "Kenneth Rosen"
  cover: "/img/books_cover/discrete_math.webp"
  reading_progress: 30%
  review: "对于现在的我回想起来感觉没啥，因为就是一些组合数学里面很简单的部分挑出来讲了一遍，像是基本数学书的第一章抄过来拼在一起，我不知道计算机人如何看待。至少我现在回过头来看还蛮简单的，也觉得学这玩意儿没多大的必要，因为后面你学一些算法的时候自然而然会接触到，再慢慢学也不迟。我当时大一看这本书就是看着好玩学了学。另外这本书非常厚，我这里列的是原版，实际上这本书是有中译本的（这就不得不说计算机社区的人翻译书籍力度真的大），我当时脑抽买成什么教学改编版了，变得很薄删减了不少有趣的章节（这本书的完成度是按照完整版本估算的），或许是因为这个缘故让我觉得无趣。不过这本书集合论最后一部分对于无穷集的一些讨论让当时刚上大学的我来说觉得很牛，很有趣，不过现在看来都是数理逻辑里面很基础的东西，或许直接看深一点的数学教材更好一些，当然计算机人可能追求的就是最短最够用的一个数学的介绍。"

- title: "Grid Homology for Knots and Links"
  isbn: "978-1-4704-1737-6"
  category: "math"
  author: "KPeter S. Ozsvath, Andras I. Stipsicz, Zoltan Szabo"
  cover: "/img/books_cover/grid.webp"
  reading_progress: 30%
  review: "参加数学院的Knot Theory讨论班的材料，跟着看了前面七章，也就大概三分之一的内容。至少对于我这个物理系的学生来说这本书写的还是很友好的，甚至附录还有点同调代数的介绍，总之就是在ChatGPT辅助下我觉得应该能理解（至少我读的前七章）的基本内容，也就是Grid同调是在干什么？它是如何计算的？而这个领域其实就是二十年前大家想用计算机去算纽结不变量发展出来的一套算法，可以看作是Floer同调的离散组合式实现，可以看作是Alexander多项式的范畴化。书里面也很技术，也正因如此所以大部分内容都忘了（网站上有当时的笔记，不过比较草率，而且后面也没写完其实）。但是总的来说还是一个很有趣的理论，而且我也一直在想这种grid的计算和物理有什么联系，毕竟Floer同调和物理还是有一些联系的，而物理上很多组合学的编码和这种grid图的编码都极其类似，当然很有可能只是个巧合罢了。Anyway，不管是否和物理有关，纽结理论本身就是个非常有趣的领域，值得花时间了解！我记得讨论班的时候提到过Snapy这个python的包就有用这个算法算同调的功能，可惜那个学期有点忙，不然自己写一个程序实现简单的丐版应当也是很有趣的。"

- title: "Quantum Field Theory"
  isbn: "978-0521864497"
  category: "physics"
  author: "Mark Srednicki"
  cover: "/img/books_cover/srednicki.webp"
  reading_progress: 100%
  review: "这本书应当是学习QFT给初学者的被认为是最好的一本教材了，当然也有不少人不喜欢。实际上大体上我觉得还是不错的，从一开始就把重整化的概念引入进来，而不是等到要算圈图发散了再说。绝大部分章节都是readable的，除了最后面讲一些孤子啊以及唯象上面标准模型的介绍之类的写的有些跳跃，其他部分还是写的不错的，至少对当时的我而言如此。不过这本书虽然600面，但其实讲的没多深，能让你对QFT有个大致而且是理论学家视角的了解，但是读完这本书之后至少对当时的我而言依旧有很多地方是不甚理解的，依旧觉得重整化一些地方没讲明白，后面我慢慢看别的教材，看了看历史上的脉络才慢慢搞清楚这一点。当然这对于初学者而言无所谓，因为我想绝大部分人都不是一遍就能学会QFT的，而Srednicki一个很大的优势就是你虽然有些地方还是太理解，但是你读完这本书能知道QFT是一些重要的量是如何计算的，能掌握最基本的计算方法，也知道要如何做重整化（即便你可能没有真正理解他）。而学QFT第一遍最重要的就是会计算，而这也就引入这本书第二个优势，除了推导详细，这本书的习题还是相当doable的，没那么多花里胡哨，习题量足够而且并不难，就是中规中矩依照课本内容掌握计算方法。而且习题在网上是有官方答案的，所以我建议读这本书的所有同学都完整做一遍课后的习题（虽然大家都知道QFT的计算非常复杂，实际上我做完所有习题光是答案就写完了一整个厚本，但是这些事情都是要经历第一遍的，后面你再看别的书看到书里面的计算就可以略微偷懒一点了），虽然我写书评常常说做习题没多大必要，但是对于这本书我觉得还是很有必要的，特别是因为习题很优质。市面上有不少书，但是对于有完整习题答案而且难度没那么夸张的真的寥寥无几。最后这本书基本上全书使用路径积分的讲法，这确实也是理论物理如今的标准语言，但是也并不是说正则量子化就被完全淘汰了，其实我觉得粒子态构造这类微妙的东西用正则量子化还是讲的清楚一些的，实际上这本书在讨论LSZ公式这种微妙的东西要去构造粒子态的时候，定义S矩阵的时候就是我记得唯一使用正则量子化的地方。"

- title: "Introduction to Quantum Effects in Gravity"
  isbn: "978-0521868341"
  category: "physics"
  author: "Viatcheslav Mukhanov, Sergei Winitzki"
  cover: "/img/books_cover/cqft.webp"
  reading_progress: 80%
  review: "很简单的一本书，甚至是从标量场QFT开始讲起，所以也别指望讲得多少深，我还剩下最后一个part没有看完。但是我觉得这本书把弯曲时空QFT的基本原理还是讲的非常透彻的，我在看这本书之前就听杜老师反复和我提弯曲时空量子场论的粒子态构造有些问题，看了这本书我才知道原来是因为真空非常subtle，有ambiguity，但是又通过博戈留夫变换联系起来，也正是因为这个ambiguity，让我们能够顺利解释为不同observer看到不同的真空，一个观察者相对于另一个而言可以看作是处于热浴中。对于Hawking温度这些解释的非常到位。当然还是我说的，这种整体的东西能解释的很好，但是粒子态这种局域的东西就很subtle了，所以在别的一些地方或许这个理论就不是那么顺手了。不管怎么说，当今的量子引力研究还是多少受到是弯曲时空量子引力理论的发展的，而且似乎早期宇宙里面还是会用不少这方面的东西？我不是专家我就不评论了，不过学着还是很有意思的，虽然里面的不少东西我后面没有直接用到过，但是在之后看量子引力近年的一些论文中也常惊呼：这个地方和之前在这本书里面看到的某个式子好像！\n\n这个方向介绍书似乎目前来说不多，不过或许这本书是很好的第一本选择。而且非常简单阅读，我甚至觉得读完David Tong的那本很简单的QFT讲义就能读这本书了，不妨花个三四周迅速读读。"

- title: "Lectures on the Infrared Structure of Gravity and Gauge Theory"
  isbn: "978-0691179735"
  category: "physics"
  author: "Andrew Strominger"
  cover: "/img/books_cover/celestial.webp"
  reading_progress: 80%
  review: "这本书实际上是讲义1703.05448，我个人更喜欢书版的排版。这个题目基本上是我本科三年级时候科研训练的题目，可以看作是天球振幅这一方向的来源。那个时候正好是天球振幅如日中天的时候，用杜老师的话说就是莫名其妙的火了起来，当然很快，几乎是在我大学快毕业的时候，这个方向就沉寂了。这也很正常，因为大家的目的是建立平坦时空的全息理论，但是显然没有弦理论的指导告诉你怎么走，而且随着研究的深入大家发现平坦时空边界，或者说天球上的CFT如果存在将会非常怪异，而天球振幅这一方向大家所做的基本上是把bulk里面的东西搬到边界上去看，然而并没有什么卵用，因为bulk里不会还是不会，所有的结果都可以认为是trivial的，那个时候甚至你只要做一个梅林变换，讲讲故事就能发篇prl。虽然快速进入这个领域能让一些人迅速发一些文章找到教职，但是一个根本不solid的方向显然肯定是活不长久的，如我所言，现在基本上还在做的人很少了，再过个几年或许大家也就彻底忘却了。\n\n 不过这并不代表我不推荐这本书，因为这本书是天球振幅的前身，并不代表他就是天球振幅。实际上这本书考虑的是极其微妙的QFT的红外问题，从众所周知的软定理出发，重新在large gauge transformation的视角下审视，自然进入到渐进平坦时空边界上的BMS群的视角，把软定理和这部分对称性的Ward恒等式联系起来。我觉得还是很妙的，我记得Hawking发表的最后一篇论文，就是和Strominger一起干的黑洞软毛，在这本书的最后一章也有所涉及，不过我当时看这本书的目的就是去看天球振幅，所以剩下的记忆效应和黑洞那一章就没看了。主要是那个时候我Penrose图都不太会，一看到黑洞那一章的讨论就头大，后来懂了不少GR，但那个时候我已经不关心这个方向，就再也没看过了。总之这是一本很有意思的书，但是读的时候如果GR学的不好其实会有些吃力，虽然天球振幅需要你会一些CFT，但是在我印象中这本书没有太涉及到CFT相关的知识。GR部分主要是渐进平坦时空的讨论，这其实还算是很advanced的topic，可以在梁书第三卷找到不错的讨论，我个人比较喜欢1801.07064，其书版本我也有介绍。最后，实际上当年我草草写过一个天球全息的笔记，抄了抄书和论文，在本网站的Downloads页面，虽然内容没必要看，不过那个笔记排版模板我还挺喜欢的。"

- title: "Advanced Lectures on General Relativity"
  isbn: "978-3-030-04260-8"
  category: "physics"
  author: "Geoffrey Compère"
  cover: "/img/books_cover/adv_gr.webp"
  reading_progress: 40%
  review: "这本书实际上是1801.07064，讨论了经典引力里面的四个比较advance的topic，我主要是当时看天球的时候参考下第一章和第三章，也就是surface charge和BMS群的部分。其实我记得这两个问题是非常subtle的，我记得如何在GR里面定义local的energy的概念到目前还没搞清楚，而一般的场论大家肯定是会写能动量张量的。从梁书第三卷的讨论也可以看到如何在数学上严格定义渐近平直时空也是个问题，物理上面或者说天球上面大家通常说的BMS群实际上是提前选了个坐标的，而不是GR里面希望是坐标无关的那种几何上的形式，不选个Bondi规范这种的话，那个代数会很难写（当然虽然很多论文在说BMS群的时候都会引用Bondi那篇文章。但实际上那篇文章推导非常跳步，而且我似乎没找到告诉我怎么具体推导的论文，至少我在当时记得大家都是承认了那个结果而已）。总之我觉得这本书还蛮适合学过一遍GR的同学增进理解，而且这本书读起来其实并不难，不过或许要有一些场论的视角更好，所以或许做高能物理的读起来会更顺一些。\n\n 虽然我个人并不太认可天球这个方向，而且我现在早已离开这个领域多年，但是不可否认的是在学习这个领域的过程中确实增强了我CFT和GR的一些理解，单凭这一点来说这个方向似乎对我个人而言是有用的，而最终到现在回过头来我再来审视，我几乎忘却了所有的技术细节，但是依然记得Strominger的讲义以及这本书给我的惊喜，所以推荐给各位。当然如我所说，我认为如果抱着想进入天球振幅这一方向而去读这两本书就大可不必了。"

- title: "Lectures on Riemann Surfaces"
  isbn: "978-0-387-90617-1"
  category: "math"
  author: "Otto Forster"
  cover: "/img/books_cover/riemann_surf.webp"
  reading_progress: 50%
  review: "我大四的时候旁听过左康（陈省身的学生）老师在数学院讲黎曼曲面，用的是这本书，写的当然是非常好，对于数学系同学可能有点简单，不过对物理系的同学来说刚刚好。本书的重点可以看作是通向Riemann-Roch定理，紧黎曼曲面的结晶，我当然是奔着这个来的，因为Riemann-Roch定理在弦论上很重要，用来把鬼场零模数出来，否则你都不知道振幅对模空间积分的时候怎么写。所以大致看了前面两章，不过由于那个时候毕业论文比较忙，而且左康虽然是很牛的数学家，但是讲课不是太好，甚至后面因为他要出差就直接网课了，效果很差。所以我虽然看了，但是看的很匆忙，吸收进去的不多。但这本书以就是很好的，毕竟是直接从层的理论，用现代的角度讲Riemann-Roch定理的，至今我依旧有时候翻翻这本书里面的定义。当然这本书由于目标只是黎曼曲面，所以很多概念有的时候都只提够用的简化的版本，比如层的上同调就只讲到第二上同调，不再往下展开，当然推广是直接的。所以我说对于数学系的学生或许比较简单，但是物理系的学生学学黎曼曲面的理论刚刚好。不过可惜的是，我学完这书里面的黎曼罗赫定理后发现和物理学家说的长得有点不一样，我依旧不知道怎么回到物理学家的版本。似乎Cecotti的弦论书上写了这部分，或许之后学的时候可以再看看，顺便复习一下这本书。"

- title: "明解C++"
  isbn: "9787115576484"
  category: "computer"
  author: "柴田望洋"
  cover: "/img/books_cover/cpp.webp"
  reading_progress: 100%
  review: "在日本看到架子上摆了不少这个书，看起来销量不错，刚好发现有中译本就心血来潮看了看，因为我本身就有c的编程经验，虽然很久没写代码了，但是竟然看看书就能很快的回忆起来。这本书我也就看的非常快，我不是计算机专家所以也没什么好点评的，但是这本书实际上主要还是面向过程，当然C++最主要的特性或许就是类，但是这本书由于篇幅限制没有展开讲更高级的内容，作者放在另一本书里面讲了，而遗憾的是那本并没有中译本。当然编程语言的书籍其实都大同小异，无非就是把官方文档整理成了更好读的格式，这一点在Mathematica和Matlab的书里面展现的淋漓尽致，说句题外话，别的编程语言或许你还是找本书看看，而这两个东西你还是直接查官方文档吧，比市面上的书籍要好一万倍其实。所以其实也无所谓哪本书更好，我觉得或许只要不是计算机系上课用的教材都是好的。。。重点还是多实践，看书的时候不要局限于书籍上有的代码，而是推敲原则上另一种方式能不能行，然后自己运行一下看看预期结果，至少我自己学编程的经验就是这样，多捣鼓捣鼓对着编辑器反复调试肯定比单单看一本书就好。不过既然你都已经要学计算机了，这些事情应该完全不需要我来再说一遍了。。。（不过讽刺的是因为我并非奔着成为C的专家去学的，只是想知道一下这门语言的大概特性所以看得很快没有上手写过啥代码。。。）\n\n最后多提一嘴，我看这本书主要是想看下一本我相中的算法书（我虽然有很多编程经验但是对算法其实一窍不通，我觉得这太可怕了，还是得知道一些。。。），不过那本书是日语的，我顺便练习日语看的，而我看这种休闲类书籍只有吃晚饭的那半个小时摸鱼时间，所以应该会很慢，期待不久的将来在这个页面更新相应的书评。"

