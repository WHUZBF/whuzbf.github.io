- title: "微分几何讲义"
  isbn: "9787301009529"
  author: "陈省身，陈维恒"
  category: "math"
  cover: "/img/books_cover/微分几何讲义.webp"
  reading_progress: 80%
  review: "这是当时微分几何的教材，初读起来其实很难，主要是第一章就引入了函数芽这种对物理系学生非常陌生而又非常抽象的概念。实际上我后来对这个概念略懂一二是读了Otto的黎曼曲面之后的事情。不过当你读完第一章之后你会发现这本书写的确实非常精彩，各个章节环环相扣，对纤维丛讲的也非常清晰（作者是陈老，这不清晰才怪）。不过在阅读这本书之前我建议物理系的学生先通过广义相对论学习一遍偏向于计算应用的微分几何，这样会有更好的阅读体验。\n\n这本书对黎曼几何的探讨还比较欠缺，我本科微分几何课在后半段就用另外的书讲黎曼几何里面的一些比较定理之类的东西了，不过我不太感兴趣，所以就没去听这部分内容。总之，这本书对于物理系的学生完全够用了。"

- title: "Introduction to Quantum Mechanics"
  isbn: "9781108103145"
  author: "David J·Griffiths"
  category: "physics"
  cover: "/img/books_cover/qm_griffiths.webp"
  reading_progress: 100%
  review: "这是我本科看的第一本真正的物理书，我四大力学最早学的是量子力学，不过这本书原则上确实可以如此操作。当然你要是不懂任何力学知识的话有些地方理解起来还是很困难。这个网站上有我自己根据这本书当年写的一些笔记，当然里面涉及到很多别的教材以及高等量子力学里面才有的东西。\n\n很多人说这本书简单，看完之后学不到东西，如果你只满足于看完这本书的话，那么这句话基本上就是对的，但是如果你向我一样把这本书的所有习题全部都写了一遍，那我觉得收获是巨大的。另外这本书并不关注算符形式的量子力学，如果你想做理论物理，那我建议你看一看科恩量子力学第一卷的前面几章好好学学算符形式（这本书三卷太厚了，后面的没必要看）。"

- title: "C Primer Plus"
  isbn: "978-7-115-39059-2"
  author: "Stephen Prata"
  category: "computer"
  cover: "/img/books_cover/c.webp"
  reading_progress: 60%
  review: "这本书是高中疫情在家的那段时间读的，其实很早就买了，本来初中的时候就对编程感兴趣，后来疫情在家加上有电脑，天赐良机，所以读这本书玩了玩，到疫情结束我大概读完了这本书的一半，后来上了大学重新学C，指针这些比较难的内容再学了一遍，所以完成度给到百分之六十。编程语言这个东西学了之后如果不用，语法百分百会生疏，但是学的毕竟是编程思维，语法这个东西要用的时候随便找一本书就能捡回来，虽然大家都说C难学，但那是说写起来难写，其实我觉得这本书对高中生甚至是初中生完全是readable的，重点是C还不像C++那样涉及到类的概念，所以没有面向对象编程，而面向过程编程学起来是非常容易的，虽然现在是AI时代不少人鼓吹程序员被取代之类的话，不过能读懂程序本身我觉得已经是理工类专业的必备技能，而且编程本身足够有趣，That is enough。"

- title: "Python Crash Course"
  isbn: "978-1-7185-0271-0"
  author: "Eric Matthes"
  category: "computer"
  cover: "/img/books_cover/python.webp"
  reading_progress: 80%
  review: "这本书是在我高中学完C之后，高考完的那个暑假学的，我认为python是非常适合编程入门学习的语言，语法上比C随意不少，非常适合初学者先了解编程思维，而且这本书我的印象中比较少涉及到面向对象编程（也可能是当时我学习没有注意这一块，因为学过C之后大脑还是面向过程思维方式），这一点好处是让初学者不用强行去学习这门艺术。\n\n我并不是计算机专业的学生，看的计算机方面的书还是比较少，不过如果想学习计算机知识，最重要的还是实践，事实上我觉得计算机不可能单纯看书就能学懂，必须要自己上机写代码，而且要勇敢写书中没出现但是你逻辑上觉得应该可行的代码，这样才能学到真正的知识。另外这本书是有中译本的：Python 编程：从入门到实践（第三版）。"

- title: "みんなの日本語"
  isbn: "978-9900331360"
  author: "日本3A出版社"
  category: "language"
  cover: "/img/books_cover/Japanese.webp"
  reading_progress: 80%
  review: "这套书是我学习日语的教材，如果你想通过考试，那么我建议你选择标准日本语，这一套丛书更适合爱好者学习，因为侧重口语表达，所以在实用性上更加好一些我觉得，不过口语和听力对我来说还是太难了，我现在学日语除了懂一点最基本的留学用还有一点就是为了看懂日本的一些科技书籍，日本还是有不少写的很好的物理书和数学书的。\n\n另外我建议你在读这套书学习日语的同时听出口仁老师（@deguchi）在YouTube上对文法部分的讲解，不少地方比书上讲的更加清晰。"

- title: "同调论"
  isbn: "978-7-301-08676-6"
  category: "math"
  author: "姜伯驹"
  cover: "/img/books_cover/同调论.webp"
  reading_progress: 80%
  review: "这本书名字叫同调论，或许给人的感觉是一本高阶的同调代数的书，实际上就是一本代数拓扑入门级别的书，也是我上代数拓扑课用的书。似乎大家都喜欢用Hatcher，在上课时老师也多次提到，比如相比于Hatcher这本书就没有引入Ext和Tor函子来一般地表述万有系数定理，另外这本书基本上只讲了同调群的计算，没有讲关于同伦群的内容。而且所涉及到同调群计算的都是很老的方法，所以基本也就只能算曲面的一些同调群，当然同调群本身也是很难算的东西，就代数拓扑入门来说我觉得这本书概念的解释还是很到位的，至少很多证明或概念的几何图像都很清晰，对物理系学生来说推导起来还算比较友好。\n\n 可惜的是由于时间原因课上没有讲到最精彩的最后一章涉及到Poincare对偶等定理，后面因为毕业很忙所以我自己看的也很潦草，不比我学习点集拓扑，代数拓扑我在习题上花的时间比较少，所以学的也很浅，所以虽然我确实逐字逐句看完了这本书，但我只敢给自己标榜看完了80%。"

- title: "绳圈的数学"
  isbn: "9787561161449"
  category: "math"
  author: "姜伯驹"
  cover: "/img/books_cover/绳圈的数学.webp"
  reading_progress: 70%
  review: "还放一本姜院士的书，这其实是一本高级科普书籍，有高中数学知识就能阅读。但是他是对我拓扑学的启蒙图书，让我了解到原来绳结（扭结）里面还有这么多数学，让我了解到原来还可以用多项式来判断两个绳结是否同痕（等价）。当我后面学习的物理知识增多时，知道Witten获得Fields奖一部分原因是用Chern-Simons理论Wilson loop的计算重新发现了Jones多项式，我对纽结理论的兴趣也更加加深了。\n\n顺带一提，这个网站上有关于纽结理论grid上同调讨论班实录，有一些关于纽结的介绍，可惜后面一些内容我弃坑没更新了。"

- title: "点集拓扑和代数拓扑引论"
  isbn: "9787301230602"
  category: "math"
  author: "包志强"
  cover: "/img/books_cover/topo.webp"
  reading_progress: 100%
  review: "上课时的教材，不过在上课之前一年多，我就自己学过这一本书，现在看来不算特别惊艳，但是中规中矩，读起来难度也不算太大，这本书的前置知识要求很低，所以物理系学生的分析学水平完全够用，不过我推荐在读这本书的时候顺便读一读Armstrong（这本书由于我挑着章节读的，所以我就不写在图书介绍里面了），因为Armstrong里面写了很多这本书里面没涉及到的技术细节，而且比如单纯逼近这种技术在代数拓扑的证明中也常常用到（当然我是物理系的，可以偷懒不去管这些证明细节）。\n\n点集拓扑的故事已经过去很久了，但让我非常欣喜的还是当我在暑假的时候读到原来曲面可以完全用亏格和是否可定向两个离散的变量完全分类，正如我在读李群读到Dykin图一样，这种分类定理总是能让我感到非常奇妙。另外说一句，本网站上有我关于这本书的笔记，可以参考。"


- title: "Scattering Amplitudes in Gauge Theory and Gravity"
  isbn: "978-1-107-06925-1"
  category: "physics"
  author: "Henriette Elvang, Yu-tin Huang"
  cover: "/img/books_cover/scattering_amplitudes.webp"
  reading_progress: 100%
  review: "这本书绝对是所有想做量子场论散射振幅科研的同学必看的一本好书，阅读起来并不难，除了一些特殊专题需要读几遍并配上原始论文才能完全理解，全书对场论散射振幅可以说做了一个非常系统且全面的总结，而且对场论振幅计算中所使用的一些关键技术都进行了详细的说明。也正是这本书让我了解到了SYM振幅的有趣之处，黑白点图以及动量扭量空间内振幅的几何解释都有非常精彩的论述。可能唯一的遗憾是感觉这本书对圈图层面的技术介绍的比较少，可能与两位作者本人的研究方向有关，我记得好像这本书连IBP方法都没有讲。不过圈图的书也有例如Henn&Plefka Scattering Amplitudes in Gauge Theories这样优秀的书存在，而且圈图的技术近年来发展的很快，这些内容更应当在论文中寻找。"

- title: "String theory and M-theory: a modern introduction"
  isbn: "978-0-521-86069-7"
  category: "physics"
  author: Becker, Becker, Shwarz
  cover: "/img/books_cover/bbs.webp"
  reading_progress: 90%
  review: "这本书应当算是目前所有弦论标准教科书里面最新的一本，从玻色弦一路讲到M理论、F理论还有黑洞微观态计数，AdS/CFT对偶等前沿内容，所以从知识体量上看肯定是管够的。但这就出现一个很大的问题，这些知识远远不可能在八百面的书籍里面讲清楚，所以这本书的三位作者想去尽力为读者构建一个宏大的弦论的picture，而不是专注于其中的技术性细节，毕竟这本书只用了二三十面就讲完了CFT，所以不要指望在这本书中学到很多关于弦论的计算细节。过分简化计算细节，比如弦论的散射振幅压根就没提，而这是弦论的根基，是弦论真正可以计算的东西。由此三位作者为读者编织了弦论书很好读的假象，而这显然是错的，我也非常不同意网上大家的观点，觉得这本书读起来很简单，对于我来说这本书读起来真的很困难！你想真正弄懂这本书每一个公式推导怎么来的，是一定要读这本书后面附的参考文献，否则就只是走马观花式的看了一下，比如弦紧致化那一节我就读了不少Strominger的原始论文，否则我是绝对看不明白这一章的。\n\n 那么有人就会说，这本书过分简化计算细节是不是会让大家成为名词党呢？我觉得这本书还是有益的，因为很多弦论对偶这样的东西其实计算例子也不多，前期也是靠着一堆argue建立的，而BBS还是把这些物理图像讲的很清楚，所以读这本书我觉得还是能让读者对弦论是什么有个相当完备的了解。而真正科研大家会碰到的也只是弦论中的很小的一部分，那些技术再去看相应的论文去学就好了。 \n\n 即便是这样，我仍旧不推荐你把这本书的当作是弦论的第一本教材，弦论第一本教材我仍旧是推荐Polchinski，在学习一个理论的时候我建议还是先知道一些最基本的技术细节，我本人是学了Polchinski知道玻色弦的一些基本计算技术，而且还做了超弦振幅计算的相关毕业论文，才去看的BBS，所以我觉得先了解一些技术细节再去看BBS会有更好的效果。\n\n鉴于这本书后面一些内容我读的有些仓促，习题也没有时间来得及写（有的习题比较难我也不会，好在这本书附有完整的习题答案）所以我只能算自己读完了90%。最后，由于这本书作者有Schwarz，所以特地提了不少GS形式，这在当今弦论课程中是非常缺失的一部分，大部分人或许认为这是很老旧的计算方法所以不用提，但是GS形式也是pure spinor形式的前身，后者被认为是有望解决弦论非平凡背景下与R-R荷耦合问题的超弦形式，所以对于想做pure spinor的同学这本书我很推荐。（当然GS形式最好的肯定是GSW，但是那本书太老旧了，读起来可能有些不舒服）"

- title: "String theory. Vol. 1 & 2"
  isbn: "978-0-521-67227-6, 978-0-521-67228-3"
  category: "physics"
  author: "Joseph Polchinski"
  cover: "/img/books_cover/polchinski.webp"
  reading_progress: 50%
  review: "伟大无需多言，虽然大家都觉得第二卷很难读，但是第一卷还是写的非常非常友好的，特别是对技术细节的介绍，非常非常详细，不过正是因为这本书涉及到很多计算细节，我建议你在读的时候一定要跟着书做推导，没有理解的章节要多读几遍，我自己是先读过一遍，写毕业论文的时候差不多又读了一遍。读的过程中参考别的书籍，发现都有polchinski的影子，所以就弦论书而言，我觉得第一本书一定要是polchinski第一卷！这本书虽然只讲了玻色弦，但是通过玻色弦把弦论的很多技术都介绍的非常到位，我当然毕业论文做的是超弦振幅，然后我发现我只需要额外读一些书的某些章节补一些超弦的知识，而如何计算，Polchinski在玻色弦的介绍中已经给了我答案。\n\n 就像我导师在其个人主页对这本书的介绍“虽然不是不读这本书就写不出论文，但是案头备上一本还是很有好处的，很多地方回过头来发现还是Polchinski上讲得细致”。"

- title: "量子计算与量子信息"
  isbn: "978-1107002173"
  category: "physics, computer"
  author: "Michael A. Nielsen, Isaac L. Chuang"
  cover: "/img/books_cover/qiqc.webp"
  reading_progress: 70%
  review: "量子计算与量子信息是发展非常迅速的新型学科，这本书是当之无愧的学习这一方向的入门书籍，我当时是在数学学院李老师的课上学习这门理论的。由于课程时间限制，最后匆忙涉及到了一点点量子信息的内容，所以这本书上我只稍微看过一点点量子信息部分。不过总的来说这本书写的还是非常好的，很适合我这种学习理论的人的风格，写法有些偏数学，不过如果你是做实验的或者关心量子电路的物理实现的，这本书或许不能帮你多少。另外，这本书是有中文译本的。\n\n 这本书给我打下了两个思想钢印，我原本以为量子计算炒作的这么热门，那么他的能力是非常强大的，在我学习之后我才发现量子计算能做的事情是有限的，因为虽然他能并行计算，但是如何从最后的纠缠熵中一次提取大量信息是很困难的，因为我们都知道测量之后量子态就会坍缩，所以我们需要对于量子情况专门设计算法。所以是否量子算法一定闭经典算法有用，这还是个未知数。这本书讲了两类目前已知的强于经典算法的例子，一个是指数级加速的舒尔算法，还一个线性加速的Grover搜索算法。上课时老师还提到了近年来发展的矩阵计算的算法（所以对机器学习很有用）。\n\n 第二个思想钢印就是：信息是物理的。最近有关信息熵的问题一直是物理学研究的前言问题，比如理论物理中就涉及到很多黑洞熵计算的问题，这被视作是通往量子引力之路。虽然做这些东西不一定非要详细了解量子信息理论，不过看一下总无坏处。\n\n 最后，你如果对纯数学更感兴趣，我推荐你关注一下拓扑量子计算这个方向，涉及到用幺正范畴去研究量子计算，起源于拓扑序的研究，Kitaev的杰作。一个不错的入门书籍是Zhenghan Wang写的Topological quantum computation。"

- title: "Quantum Field Theory: From Basics to Modern Topics"
  isbn: "978-1108480901"
  category: "physics"
  author: "François Gelis"
  cover: "/img/books_cover/Gelis.webp"
  reading_progress: 50%
  review: "这本书是杜老师讨论班上的用书，讲了一年讲完了YM场，也算是前半本书的内容，所以我只敢标榜自己看过一半，但实际上很多地方也是草草一瞥。实际上这本书真正有趣的地方是后面半本，倒不是说这本书有多么经典，讲的有多么好，而是这本书真正做到了modern，而且对现代很多场论技术都进行了简略的介绍，当然场论博大精深，很多只是很浅显的介绍，不过我觉得拿来给已经学过场论的人用来拓宽知识面还是不错的。比如通常场论书只讲1PI以及对应的有效作用量，这本书就对2PI图也进行了细致的讨论，本书最后面还对振幅技术进行了讨论，可惜没有讲BCFW递推这一极其重要的技巧。本书知名度似乎不算大，所以我在我的博客中介绍了这本书。当然，就像这本书开头就说的，这本书并非给第一次学场论的人写的教材，这本书用前面三章就迅速过完了QED的内容，初学看这本书还是太吃力了，我觉得拿来拓宽场论知识面更好。如果对书中提到的某一个章节很感兴趣，就可以尝试读一些更深入的资料。\n\n最后，这本书的封面被杜老师吐槽说很像新冠病毒，这本书出版的时候正是新冠病毒刚开始时，我们讨论这本书的时候正好是新冠病毒差不多离开时，也算是很有意思的经历。对了，这本书还被知乎@笠道梓（由于其经常换名字，所以我也不确定现在还是不是这个名字orz）翻译成中文收录在其知乎专栏中，虽然英文阅读是不难但是必要的科研技能，但是用母语读文章显然效率要高不少。"

- title: "Physics From Symmetry"
  isbn: "978-3-319-66631-0"
  category: "physics"
  author: "Jakob Schwichtenberg"
  cover: "/img/books_cover/PFS.webp"
  reading_progress: 100%
  review: "这本书是杜老师在大二时推荐我看的，可以说我决定学习高能物理契机就是因为这本书。这本书我觉得完全可以当作是高能物理入门科普，而且是非常好的科普，如果今后有志于做理论物理，不过很多人大多都是被科普里面高大上的名词吸引住了，其实根本就是叶公好龙，因此我觉得先读一遍这本书至少了解场论的世界是否是自己喜欢的。在我写下这个书评的时候距离我读这本书已经有四年了，所以我记不清这本书的细节了，总之我对低年级本科生强推这本书。我当时是在学过量子力学的情况下读的（我比较特殊，我大一就学了量子力学，是在经典力学之前学的，所以我是先在量子力学里面知道哈密顿量然后再在经典力学里面学的）。不过在我印象中这本书的前置知识好像几乎为0，所以应该对刚学完微积分学完普通物理的学生也能完全读懂。"

- title: "高等量子力学"
  isbn: "9787040099256"
  category: "physics"
  author: "喀兴林"
  cover: "/img/books_cover/Advanced_QM.webp"
  reading_progress: 100%
  review: "这本书应该算是国内很知名的量子力学的进一步学习资料了，对于我来说当时看的非常非常爽，因为公式推导完全是老一辈前苏联的作风，排山倒海式的推导，从来不省略步骤，而且在一些细节方面还有如梁灿彬老师的碎碎念，一看就是深耕教学多年的老教授才能写出来的书籍。虽然书里面讲的东西谈不上多高大上，成书时间毕竟摆在那里，但是我觉得推一遍能让你建立扎实的基本功。书中大部分内容现在我已经忘记了，但是我影响最深刻的是定态微扰论那里，特别是零级波函数简并的这种情况的处理，一般的书只算到一阶，而这本书讨论了一般情况如何处理，但是喀老师的方法过于技术而且符号太杂，看完之后往往让人不得要领，直到两年后我才偶然知道可以用resolvent方法进行优雅的处理（本网站有一个简短的笔记）。另外印象还比较深刻的是散射理论部分，其实这是数学上也很重要的一块，而且量子力学的散射实际上比QFT散射的讨论更困难，不过在数学上严格化也相对容易一些。这本书大体上还是不错的，不过总有历史遗留问题，这是那个年代的量子力学书的通病，也就是往往在最后加上相对论量子力学这一节，讲狄拉克方程之类的，我在本科的时候真的以为这部分需要学，所以真的打算看一本有关相对论量子力学的书，后来才发现其实直接去学QFT才是最正确的路子，所以读者读到这部分的时候如果想知道历史脉络可以看看，但是不必太过深究。虽然真正科研的时候用到的都是这本书的一个子集，而且似乎凝聚态方面的书籍都会默认你忘了所以会帮你复习一遍（如果现在不加复习我肯定是完全懵逼的），但是我觉得本科阶段仔细推一遍这本书还是很有益处的。"

- title: "Group Theory in a Nutshell for Physicists"
  isbn: "9780691162690"
  category: "physics, math"
  author: "A. Zee"
  cover: "/img/books_cover/Group_Zee.webp"
  reading_progress: 100%
  review: "徐一鸿先生写书写的都比较厚，所以这本书的厚度也应该是大部分学生望而却步的一大点。但是这本书实际上相当readable的，徐老师讲笑话应该也是一大能手，因为读这本书你是真的能学到很多英语里面的俚语。徐老师是Coleman的学生，所以物理方面当然是理解的透透彻彻，正因如此徐老师在讲数学的时候一定会结合物理例子讲，或者用一些物理上面我们碰到过的简单例子来说明某个数学概念，这样做的好处是让人能迅速抓到某个概念的核心，而且知道物理对应是什么，而不是单单的学了数学但是根本不知道能干嘛，对于我这个做物理的来说这是非常危险的，对物理学家而言数学终究应该被看作是工具，而不是盲目的一味去学习，你确实数学理解的越来越深了，但是你离物理科研也越来越远了。当然坏处也显然易见，这本书只能帮助你建立核心的理解，虽然他这么厚，但是你千万不要觉得你读完这本书之后对群论这门数学就理解的很好了，这本书终究其实是一本物理书，当你翻看GTM9，你依然会觉得如此陌生。不过有了这些物理直觉，我觉得能让物理系的学生大致有方向，后面科研虽然确实会碰到必须直面数学的时候，但是看完这本书我觉得好歹能让你后面真的去看数学书的时候有一些底气，而且能够直接联想这部分到底在物理上意味着什么。我觉得这是物理系学生相对于数学系学生学数学的一个优势。"

- title: "Group Theory in Physics"
  isbn: "9789971966577"
  category: "physics, math"
  author: "Wu-Ki Tung"
  cover: "/img/books_cover/Wu-Ki_Tung.webp"
  reading_progress: 80%
  review: "这本书也是在物理学家学习群论时常常被提及的一本书，相比于徐老师写的书，物理例子相对少一些，但是数学方面我觉得有些地方的讨论相比于徐老师要深一些，比如Peter-Weyl定理，这是李群理论非常重要的定理，相当于广义的傅立叶变换，我虽然现在写书评的时候已经不记得多少，但是我清晰记得这本书里面用了不少笔墨去说过这件事情，而且是结合量子力学里面的应用去说明的。这本书也是我上课的时候用的教材，整体看下来感觉还是相当不错，不过到了学期末杜老师也没有时间去讲最后面的Lorentz群的部分，而这部分又是QFT里面很重要的部分，直接决定什么是粒子态。由于当时期末比较忙，所以这部分我一直没有抽空看，只看过一点点，但是印象中对Lorentz群的表示论的讨论还是相当详尽的。惭愧的是知道想起来写书评的今天我才发现我一直没有读完最后的这几章。或许是因为后面我在学QFT的时候直接从Weinberg的第二章学了不少Lorentz群的东西，这部分也就彻底忘了去看。。。"

- title: "抽象代数学"
  isbn: "9787309020960"
  category: "math"
  author: "姚慕生"
  cover: "/img/books_cover/abstract_algebra.webp"
  reading_progress: 80%
  review: "我放这本书上来就已经做好了被数学系同学喷的准备，因为这本书是很薄一本的小册子，你很难argue他真的把抽象代数讲的多好，当然一些立志于做代数几何的同学肯定更是不屑，觉得讲的很基础一点也不现代。不过我想说的是这本书就基础知识的整理而言还是不错的，抽象代数本身就是一门很古老的学科，肯定不能指望能多么现代，就像是物理系的理论力学，不少人总觉得需要从流形这边讲才多么fancy多么modern，而我对这种观点一直并不太赞同，我觉得基础的学科重点还应该是为了后面的课程先把一些最最核心的知识掌握，至于fancy的内容后面自然会再次碰到，还是不可眼高手低。更何况实际上譬如理论力学里面的几何讲法其实后面也用不太到，想学几何，理论物理后面有的是地方折磨你，根本没必要在理论力学这种地方浪费时间，当然本科生有时间的话当然可以看看这方面的东西陶冶情操，这我并不反对。\n\n扯远了，回到对于这本书的讨论。正如前面说的，正因为对基础的定义定理总结的还是很到位，而我看数学书的视角从来是以如何为物理系的学生服务来看的。我读这本书的初衷是因为我以前系统学过的只有群论，但是最近科研反复涉及到一些代数几何的概念，所以想着系统学一下环论方便继续用ChatGPT云一点代数几何。那么从这个方面来看这本书完全是够的，还是我说的，除非你是本科生有很多时间足以去浪费，你当然可以看一本很厚的书去数学系的教室听甚至是做代数几何的老师给你讲很现代视角的抽象代数。但是如果你的目的仅仅是方便理解一些物理里面涉及到的代数概念，这本书完完全全够用，你既不会被它的厚度吓到也不会因此而漏掉一些关键的概念。\n\n实际上就算你去学很厚的抽象代数，因为大部分概念在物理学中运用的非常少，或者说并不直接应用，而是应用其高阶推论。所以这种抽象代数高度逻辑化的学科是一定会慢慢遗忘的，毕竟你学四大力学都会忘是吧。也正因如此，我看这本书几乎奔着环论看了，还剩下的百分之二十读者一定能猜到我放弃了Galois理论（当然数学系学生一定会嘲讽我放弃了最美妙的部分），只是浅浅的看了一下，当然不能算看懂，所以没有算在读书进度里面。"

- title: "Classical Mechanics"
  isbn: "9788131758915"
  category: "physics"
  author: "Herbert Goldstein"
  cover: "/img/books_cover/cm.webp"
  reading_progress: 85%
  review: "其实这本书在我年少无知的高中就买了，但从来没翻过，后来考上物理系带到宿舍就开始看了，当时刚上大学英语不熟加上其实也不知道学习方法，属于是野猪乱撞时期。正因如此我记得我耗费了大量时间在与这本书搏斗的过程中。当然这是一本很好很经典的教材（或许有人会说不够现代，没有用流形去讲之类的，这个观点我已经驳斥过很多次，这里就懒得再重复了），但是显然就经典力学这门学科而言还不值得大家花费如此长的时间，当今我们有大量更薄更readable的教材。所以如今来看读这本书的意义不大了，而北美的教育体系四大力学在有些学校研究生阶段还要重新学一遍，就是看Goldstein，Jackson的书籍，我觉得如果你是拿到教职了要教学，那么看一下肯定是很好的，但是作为现代物理学研究生，还是不要耗费时间在经典力学上了。所以尽管我看过一遍觉得这本书的讨论非常详尽清晰，我依旧不建议本科生通读一遍。\n\n我记得这本书我是读完了作用-角变量，而且针对这本书写了一整本笔记（好像保存下来了，但愿。。。），然而并没有什么作用，懂得一大堆经典力学的技巧并没有在后面实质性的帮助我，反而束缚了我的手脚，本来那段时间可以用来学习更深的物理学。所以，我推荐各位在一些觉得一般的书上没有讨论清楚的时候查一查这本书对应的章节，但是通读还是算了。"

- title: "Introduction to Statistical Physics"
  isbn: "9781439878132"
  category: "physics"
  author: "Kerson Huang"
  cover: "/img/books_cover/stat.webp"
  reading_progress: 50%
  review: "黄老师的这本书真的强烈推荐，我当时暑假自学统计力学看的书，顿时就被这门优雅的学科吸引住了，而黄老师的讨论我觉得是最清晰的，特别是集团展开的讨论以及书中论述的从经典到量子统计的关键点，也就是全同性迫使你选取居位数表象。里面的一些讨论很遗憾我只记得模糊轮廓，这本书的定位虽然跟Goldstein一样在北美的奇怪教育体制下专门给研究生准备的。但是本科生完全可以挑战，当然这本书读起来难度我觉得还是挺大的，从这本书在相当早的地方就引入了BBGKY级联方程这种一般的书都是放到最后当作topic讲的东西可见一斑。所以完整推一遍这本书定能让你获益匪浅，特别是希望做统计物理的同学。不同于经典力学和电动力学，我觉得统计物理和量子物理一样是现代物理的基石，所以我认为花时间仔细琢磨这两门看似基础的课是很划得来的。\n\n可惜的是在我读完这本书的前半本，也就是系综理论基础后还没来得及讨论应用，比如解释Bose-Einstein凝聚这种，就开学了，后面也就去看别的教材没有时间再看这本书了，如果今后有时间我一定会记起来重新读一下这本书，毕竟我对统计力学还是很有好感的。"

- title: "理论力学"
  isbn: "9787301306536"
  category: "physics"
  author: "Kerson Huang"
  cover: "/img/books_cover/liu_cm.webp"
  reading_progress: 100%
  review: "多年过后一时间也想不起来每本书对应的让我眼前一亮的东西，所以索性就三本放在一起泛泛而谈算了。\n\n刘老师在北大也算是名师，教学经验丰富，我运气非常好，读本科的时候刚好刘老师出版了他的四大力学讲义（除了量子力学刘老师似乎没有讲义，也不知道教过没有，但是刘老师其实是做量子色动力学的）。第一次知道刘老师的讲义是杜老师跟我介绍的，后面看了理论力学讲义就觉得写的非常好，特别是非常讲义风，我的意思是确实能在课堂上教完的内容，不少书说是讲义实际上都厚成字典了，而刘老师这套书既方便自学又厚度合适，但是作为基础课程完全够用。经典力学和电动力学非常不错，不过统计力学有些些不和我的胃口，或许是在读刘老师之前我早已读过Kerson Huang的缘故。。。但是作为课堂上学习用书还是很适合的。另外值得一提的是，作为理论物理入门测试的指标所并我就是在刘老师的理论力学讲义里面学来的。"

